<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  body {
    margin: 0;
    padding: 4rem 1.5rem;
    background: #faf6f0;
    color: #333333;
    font-family: "Noto Serif KR", serif;
    display: flex;
    justify-content: center;
  }

  main {
    max-width: 32rem;
    width: 100%;
    text-align: center;
  }

  h1 {
    color: #d46a8f;
    font-weight: 600;
    font-size: 2rem;
    margin: 0 0 0.5rem;
    letter-spacing: 0.05em;
  }

  h2 {
    color: #333333;
    font-weight: 400;
    font-size: 1rem;
    margin: 0 0 1.5rem;
  }

  hr {
    border: none;
    border-top: 1px solid #e8ddd3;
    width: 4rem;
    margin: 0 auto 3rem;
  }

  p {
    font-size: 1.05rem;
    line-height: 2.2;
    letter-spacing: 0.03em;
    margin: 0 0 3rem;
  }

  p:last-of-type {
    margin-bottom: 0;
  }
</style>
</head>
<body>
<main>
  <h1>진달래꽃</h1>
  <h2>김소월</h2>
  <hr>
  <p>나 보기가 역겨워<br>
  가실 때에는<br>
  말없이 고이 보내 드리우리다</p>

  <p>영변에 약산<br>
  진달래꽃<br>
  아름 따다 가실 길에 뿌리우리다</p>

  <p>가시는 걸음걸음<br>
  놓인 그 꽃을<br>
  사뿐히 즈려밟고 가시옵소서</p>

  <p>나 보기가 역겨워<br>
  가실 때에는<br>
  죽어도 아니 눈물 흘리우리다</p>
</main>
</body>
</html>
